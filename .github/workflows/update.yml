name: 定时更新光电热点数据

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TCB_API_KEY: ${{ secrets.TCB_API_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行采集器
        run: python collector/collect.py --limit 25
      - name: 部署 CloudBase（免登录，每 6 小时）
        if: env.TCB_API_KEY != ''



        run: |
          npx -y mcporter call cloudbase.auth action=login_by_api_key apiKey="$TCB_API_KEY" apiKeyEnvId="$TCB_ENV_ID" --output json
          npx -y mcporter call cloudbase.manageApps action=deployApp serviceName=opto-hot filePath="$GITHUB_WORKSPACE" buildPath=dist framework=static installCmd= buildCmd= --output json
      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if ! git diff --cached --quiet; then
            git commit -m "chore: 刷新光电热点数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: 准备站点文件
        run: |
          mkdir -p _site/data
          cp dist/index.html _site/index.html
          cp data/items.json data/hot-topics.json data/daily.json data/dailies.json data/report.csv _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4