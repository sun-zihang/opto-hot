ected": true, "role": "科研"}, {"id": "baa2b122784c", "title": "Universal Phase Contrast in Micro-CT Systems", "url": "https://arxiv.org/abs/2607.29478", "source": "arXiv 光学与光子学 (physics.optics)", "source_type": "rss", "category": "科研进展", "published_at": "2026-08-03T04:00:00+00:00", "discovered_at": "2026-08-03T13:20:06.484041+00:00", "summary": "arXiv:2607.29478v1 Announce Type: new Abstract: Conventional high-resolution micro-CT systems are regarded as attenuation-based unless visible Fresnel fringes reveal the presence of propagation-based phase contrast. Here we show that this interpretation is incomplete. When propagation-induced phase transfer is non-negligible relative to the system blur, micro-CT operates in a phase-transfer regime in which propagation improves spatial resolution relative to that expected from source and detector", "keywords": ["contrast", "micro-ct", "universal"], "score": 84.7, "links": {"original": "https://arxiv.org/abs/2607.29478"}, "selected": true, "role": "科研"}, {"id": "e9b6cc773591", "title": "Comparative analysis of wavenumber response in phase contrast and spiral phase imaging systems for plasma diagnostics", "url": "https://arxiv.org/abs/2607.29307", "source": "arXiv 光学与光子学 (physics.optics)", "source_type": "rss", "category": "光学元件与成像", "published_at": "2026-08-03T04:00:00+00:00", "discovered_at": "2026-08-03T13:20:06.484041+00:00", "summary": "arXiv:2607.29307v1 Announce Type: cross Abstract: Phase contrast imaging (PCI) has been used for decades to study plasma density fluctuations, but its wavenumber response $k$ is constrained by the phase plate groove width and beam waist. Spiral phase contrast imaging (SPCI) with a spiral phase plate may offer broader sensitivity, even though its output signal is quadratic, because it has no constraint except at the central singularity, i.e., $k = 0$. In this work, we numerically compare the wave", "keywords": ["contrast", "diagnostics", "imaging", "plasma", "response", "spiral", "wavenumber" .html"}, "selected": true, "role": "科研"}, {"id": "5c6d65cb452b", "title": "Two independent studies push semiconductor qubits towards practical scales", "url": "https://phys.org/news/2026-07-independent-semiconductor-qubits-scales.html", "source": "Phys.org 物理新闻", "source_type": "rss", "category": "光电芯片与半导体", "published_at": null, "discovered_at": "2026-08-03T13:20:06.484041+00:00", "summary": "Semiconductor spin qubits are one of the most promising building blocks for future quantum computers, but turning them into a working, large-scale quantum computer has so far proven difficult. For now, two big questions remain open: how to connect qubits that aren't sitting right next to each other, and how to control huge numbers of them without an unmanageable tangle of wiring.", "keywords": ["independent", "practical", "push", "qubits", "scales", "semiconductor"], "score": 80.0, "links": {"original": "https://phys.org/news/2026-07-independent-semiconductor-qubits-scales.html"}, "selected": true, "role": "科研"}, {"id": "eb2660a5d3d9", "title": "Photonic time crystals unlock ultrafast control of light in the terahertz range", "url": "https://phys.org/news/2026-07-photonic-crystals-ultrafast-terahertz-range.html", "source": "Phys.org 物理新闻", "source_type": "rss", "category": "科研进展", "published_at": null, "discovered_at": "2026-08-03T13:20:06.484041+00:00", "summary": "An international team of researchers from École Polytechnique, Collège de France and Helmholtz-Zentrum Dresden-Rossendorf (HZDR) has achieved a world first: the experimental realization of an all-optical photonic time crystal (PTC), a material whose optical properties can be strongly and periodically modulated over ultrafast timescales.", "keywords": ["crystals", "photonic", "range", "terahertz", "ultrafast", "unlock"], "score": 80.0, "links": {"original": "https://phys.org/news/2026-07-photonic-crystals-ultrafast-terahertz-range.html"}, "selected": true, "role": "科研"}, {"id": "9bbb915be580", "title": "Quantum spin uishable", "modular", "photons", "quantum"], "score": 80.0, "links": {"original": "https://phys.org/news/2026-07-cesium-atoms-quantum-dots-generate.html"}, "selected": true, "role": "科研"}, {"id": "6cc6625bbbb5", "title": "Light's hidden properties save quantum information from the chaos of bad weather", "url": "https://phys.org/news/2026-07-hidden-properties-quantum-chaos-bad.html", "source": "Phys.org 物理新闻", "source_type": "rss", "category": "科研进展", "published_at": null, "discovered_at": "2026-08-03T13:20:06.484041+00:00", "summary": "For years, researchers have tried to harness the \"twist\" of light to transmit data. This property describes how light spirals as it travels forward, and because it can be molded into a virtually infinite number of different twists, it provides a massive, promising alphabet for high-capacity communication.", "keywords": ["chaos", "hidden", "information", "quantum", "save", "weather"], "score": 80.0, "links": {"original": "https://phys.org/news/2026-07-hidden-properties-quantum-chaos-bad.html"}, "selected": true, "role": "科研"}, {"id": "eef321c35b22", "title": "Physicists link the Riemann Hypothesis to phase transitions in quantum systems", "url": "https://phys.org/news/2026-07-physicists-link-riemann-hypothesis-phase.html", "source": "Phys.org 物理新闻", "source_type": "rss", "category": "科研进展", "published_at": null, "discovered_at": "2026-08-03T13:20:06.484041+00:00", "summary": "A new study in Nature Communications has established a link between the Riemann Hypothesis and dynamical phase transitions in engineered quantum systems, demonstrating the effect on a quantum processor.", "keywords": ["hypothesis", "link", "physicists", "quantum", "riemann", "transitions"], "score": 80.0, "links": {"original": "https://phys.org/news/2026-07-physicists-link-riemann-hypothesis-phase.html"}, "selected": true, "role": "科研"}, {"id": "34bbb8804bc3", "title": "One LED produces four stable colors at room temperature", "url": "https://phys.org/news/2026- const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const CAT_CLS = S.catCls || {};
function fmtRel(iso){
  if(!iso) return "";
  const t = new Date(iso);
  const d = (Date.now() - t.getTime())/1000;
  if(d < 60) return "刚刚";
  if(d < 3600) return Math.floor(d/60)+" 分钟前";
  if(d < 86400) return Math.floor(d/3600)+" 小时前";
  return Math.floor(d/86400)+" 天前";
}
function effDate(it){
  const p = it.published_at;
  if(p && p.length >= 10) return p.slice(0,10);
  const d = new Date(it.discovered_at);
  const off = d.getTime() + 8*3600*1000;
  return new Date(off).toISOString().slice(0,10);
}
function fmtDay(dstr){
  const [y,m,d] = dstr.split("-").map(Number);
  return y+"年"+m+"月"+d+"日";
}
function wdCN(dstr){
  const dt = new Date(dstr+"T00:00:00+08:00");
  return ["周日","周一","周二","周三","周四","周五","周六"][dt.getDay()];
}
function todayCN(){
  const d = new Date(Date.now()+8*3600*1000);
  return d.toISOString().slice(0,10);
}
function isToday(dstr){ return dstr === todayCN(); }
function scoreCls(s){ return s>=75?"score-hi":(s>=50?"score-mid":"score-low"); }
function pubLabel(it){
  if(it.published_at){
    const p = it.published_at;
    if(p.length===7) return p+"（月级）发布";
    if(p.length===10) return p+" 发布";
    return p.replace("T"," ").slice(5,16)+" 发布";
  }
  return "收录 "+fmtRel(it.discovered_at);
}
function catBadge(cat){ return '<span class="badge b-cat">'+esc(cat)+'</span>'; }

    top.map((t,i)=>'<li class="hot-topics-row"><span class="hot-topics-rank hot-topics-rank-'+(i+1)+'">'+(i+1)+'</span><a class="hot-topics-link" href="'+esc(t.links&&t.links[0]?t.links[0].url:"#/hot")+'" target="_blank" rel="noopener">'+esc(t.title)+'</a><span class="hot-topics-meta">'+t.source_count+' 来源 · <b>'+Math.round(t.heat||t.score)+'</b> 热度</span></li>').join("")+

  // group by day
  const groups = {};

  if(state.cat!=="全部") its = its.filter(i=>i.category===state.cat);
  if(state.sort==="score") its.sort((a,b)=>b.score-a.score);
  else if(state.sort==="time") its.sort((a,b)=>b.discovered_at.localeCompare(a.discovered_at));
  root.querySelector(".count").textContent = its.length;
  const list = $("#all-list"); list.innerHTML = its.length ? its.map(itemCard).join("") : '<div class="empty">没有匹配的条目</div>';
}
function renderHot(){
  const root = $("#view-hot");
  root.innerHTML = '<div class="card"><ol class="hot-rank-list">'+S.topics.map((t,i)=>{
    const flag = t.status==="爆"?'<span class="flag flag-hot">爆</span>':(t.status==="发酵中"?'<span class="flag flag-warm">发酵中</span>':'<span class="flag flag-watch">关注中</span>');
    const chips = (t.sources||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join("");
    const link0 = t.links&&t.links[0]?t.links[0].url:"";
    return '<li class="hot-rank-row"><span class="hot-rank-no">'+String(i+1).padStart(2,"0")+'</span>'+
      '<div class="hot-rank-main"><div class="hot-rank-title"><a href="'+esc(link0)+'" target="_blank" rel="noopener">'+esc(t.title)+'</a> '+flag+'</div>'+
      '<div class="hot-rank-meta"><span>'+(t.sources[0]||"")+'</span><span>'+fmtRel(t.latest_at)+'</span><span>'+t.source_count+' 个信源 · '+t.signal_count+' 条信号</span></div>'+
      '<div class="src-chips">'+chips+'</div></div>'+
      '<div class="hot-rank-heat">'+Math.round(t.heat||t.score)+'<div style="font-size:11px;color:var(--muted);font-weight:400">热度值</div></div></li>';
  }).join("")+'</ol></div>';
}
function renderDaily(){
  const root = $("#view-daily");
  const dates = Object.keys(S.dailies||{}).sort().reverse();
  const d = state.dailyDate && S.dailies[state.dailyDate] ? state.dailyDate : (dates[0]||todayCN());
  state.dailyDate = d;
  const rep = S.dailies[d];
  const side = '<aside class="daily-side"><div class="daily-side-card"><h3>日报归档</h3>'+
    dates.map(x=>'<div class="daily-day'+(x===d?" daily-day-active":"")+'" data-d="'+x+'">'+fmtDay(x).slice(5)+'<span class="week">'+wdCN(x)+'</span></div>').join("")+
    '</div></aside>';
  let body = '<div class="m-daily-body">';
  if(rep){
    const toc = rep.sections.map((s,i)=>'<li><a class="reader-toc-row" href="#sec-'+i+'"><span class="reader-toc-no">'+String(i+1).padStart(2,"0")+'</span><span class="reader-toc-label">'+esc(s.category)+'</span><span>'+esc(s.articles[0].title)+'</span></a></li>').join("");
    body += '<div class="m-daily-eyebrow">OPTOHOT DAILY</div><div class="m-daily-issue-date">'+esc(rep.label)+' · '+esc(rep.weekday)+'</div>'+
      '<nav class="reader-toc"><div class="reader-toc-head"><span class="reader-toc-heading">今日看点</span><span class="reader-toc-meta">'+rep.tocCount+' 篇报道 · 约 '+rep.readMinutes+' 分钟</span></div><ol class="reader-toc-list">'+toc+'</ol></nav>';
    rep.sections.forEach((s,i)=>{
      body += '<section class="daily-sec" id="sec-'+i+'"><h3>'+esc(s.category)+'</h3>'+
        s.articles.map(a=>'<article class="daily-article"><div class="daily-article-title"><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a></div>'+
        '<div class="daily-article-source"><span class="role-tag">'+esc(a.role)+'</span><span>'+esc(a.source)+'</span><span>'+esc(pubLabel(a))+'</span></div>'+
        (a.summary?'<p class="daily-article-summary">'+esc(a.summary)+'</p>':"")+'</article>').join("");
      body += '</section>';
    });
  } else {
    body += '<div class="empty">该日期暂无日报</div>';
  }
  body += '</div>';
  root.innerHTML = '<div class="daily-shell">'+side+body+'</div>';
  $$(".daily-day", root).forEach(el=>el.onclick=()=>{ state.dailyDate = el.dataset.d; renderDaily(); });
}
function renderTopics(){
  const root = $("#view-topics");
  const rows = S.daily.byCategory || [];
  root.innerHTML = '<div class="topic-grid">'+rows.map(r=>
    '<div class="topic-card" data-cat="'+esc(r.category)+'"><div class="t-name">'+esc(r.category)+'<span class="badge b-cat">'+r.total+'</span></div>'+
    '<div class="t-nums"><span>24h <b>'+r.last24h+'</b></span><span>7d <b>'+r.last7d+'</b></span><span>共 <b>'+r.total+'</b></span></div></div>').join("")+'</div>';
  $$(".topic-card", root).forEach(el=>el.onclick=()=>{ state.cat = el.dataset.cat; $("#all-cat").value = state.cat; location.hash = "#/all"; });
}
function renderData(){
  const root = $("#view-data");
  const dl = S.daily;
  const maxDay = Math.max(...dl.byDay.map(x=>x.count), 1);
  const chart = '<div class="day-chart">'+dl.byDay.map(x=>'<div class="day-col"><div class="dbar" style="height:'+Math.max(2,x.count/maxDay*100).toFixed(1)+'%"></div><span class="dl">'+x.date.slice(5)+'</span></div>').join("")+'</div>';
  const rows = dl.bySource.map(s=>'<tr><td>'+esc(s.source)+'</td><td>'+s.count+'</td><td>'+fmtRel(s.latestAt)+'</td></tr>').join("");
  root.innerHTML =
    '<div class="stats">'+
    '<div class="stat"><div class="num">'+dl.total+'</div><div class="lbl">收录总数</div></div>'+
    '<div class="stat"><div class="num">'+dl.last24h+'</div><div class="lbl">24 小时新增</div></div>'+
    '<div class="stat"><div class="num">'+dl.last7d+'</div><div class="lbl">7 天新增</div></div>'+
    '<div class="stat"><div class="num">'+dl.topicCount+'</div><div class="lbl">热点话题</div></div></div>'+
    '<div class="card pad"><h3 style="font-size:14px;margin-bottom:6px">每日收录趋势（近 14 天）</h3>'+chart+'</div>'+
    '<div class="card pad" style="margin-top:14px"><h3 style="font-size:14px;margin-bottom:6px">数据来源</h3><table><thead><tr><th>来源</th><th>收录数</th><th>最新收录</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="dl-row"><a class="dl-btn" href="data/report.csv" download>⬇ 下载 CSV</a><a class="dl-btn" href="data/items.json" target="_blank">查看 items.json</a><a class="dl-btn" href="data/hot-topics.json" target="_blank">查看 hot-topics.json</a><a class="dl-btn" href="data/dailies.json" target="_blank">查看 dailies.json</a></div>';
}
const renderers = { feed:renderFeed, all:renderAll, hot:renderHot, daily:renderDaily, topics:renderTopics, data:renderData };
function bind(){
  const cats = new Set(S.items.map(i=>i.category));
  const sel = $("#all-cat");
  for(const c of cats){ const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); }
  $("#q").addEventListener("input", e=>{ state.q = e.target.value; if(location.hash==="#/all") renderAll(); });
  $("#all-cat").addEventListener("change", e=>{ state.cat = e.target.value; renderAll(); });
  $("#all-sort").addEventListener("change", e=>{ state.sort = e.target.value; renderAll(); });
  window.addEventListener("hashchange", router);
  router();
}
document.addEventListener("DOMContentLoaded", bind);

</script>
</body>
</html>
